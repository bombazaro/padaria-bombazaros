[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Arquivos com hash no nome (JS, CSS, imagens) podem ficar em cache "para sempre"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Faz /trabalhe-conosco funcionar ao recarregar a página (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
